<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarketingCy CMS — Development Prototype</title>
<style>
:root{--blue:#0C83C3;--navy:#102b4c;--muted:#65758a;--line:#e3eaf2;--bg:#f5f8fc}*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,Arial,sans-serif;background:var(--bg);color:var(--navy)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:244px 1fr;min-height:100vh}.side{background:#0c213e;color:white;padding:24px 16px}.brand{font-size:21px;font-weight:800;margin-bottom:32px}.brand span{color:#4ab9f2}.side button{display:block;width:100%;background:transparent;color:#cbd8e9;border:0;text-align:left;padding:12px 14px;border-radius:8px;margin:3px 0}.side button.active,.side button:hover{background:var(--blue);color:white}.side{display:flex;flex-direction:column}.side .nav{flex:1}.side-account{border-top:1px solid #ffffff25;margin-top:24px;padding-top:15px}.side-account .account-label{display:block;color:#9eb4cf;font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:0 14px 5px}.side-account #auth-identity{display:block;color:#fff;overflow-wrap:anywhere;font-size:12px;padding:0 14px 8px}.side .side-account #logout{display:block;width:100%;margin:0;background:transparent;color:#cbd8e9;border:0;text-align:left;padding:12px 14px;border-radius:8px}.side .side-account #logout:hover{background:#0C83C3;color:#fff}.main{min-width:0}.top{background:white;padding:19px 30px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.top small{color:var(--muted)}.content{padding:28px 30px;max-width:1300px;margin:auto}.heading{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}h1{font-size:27px;margin:0}h2{font-size:17px;margin:0 0 16px}p{color:var(--muted)}.btn{border:0;background:var(--blue);color:white;padding:10px 17px;border-radius:7px;font-weight:700}.btn.secondary{background:#e9f5fb;color:var(--blue)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:24px}.card,.panel{background:white;border:1px solid var(--line);border-radius:11px;padding:20px;box-shadow:0 5px 16px #15365308}.card strong{font-size:29px;display:block}.card span{color:var(--muted)}.two{display:grid;grid-template-columns:2fr 1fr;gap:20px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 10px;text-align:left;border-bottom:1px solid var(--line)}.table th{font-size:12px;color:var(--muted)}.tag{background:#e2f7eb;color:#14753c;padding:4px 8px;border-radius:5px;font-size:11px}.tag.draft{background:#fff4df;color:#95610d}.quick{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:white;padding:13px;color:var(--navy)}.quick:hover{color:var(--blue)}.fields{display:grid;gap:14px;max-width:820px}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #ccd9e8;border-radius:7px;background:white}.field textarea{min-height:170px;resize:vertical}.notice{background:#e9f5fb;border:1px solid #b7e1f6;color:#205675;padding:13px 16px;border-radius:8px;margin-bottom:20px}.media{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.media div{background:linear-gradient(145deg,#dceef9,#a9d6f0);height:130px;border-radius:9px;display:grid;place-items:center;color:#205675}.hidden{display:none}.actions{display:flex;gap:10px;flex-wrap:wrap}.muted{color:var(--muted)}@media(max-width:850px){.app{grid-template-columns:1fr}.side{padding:14px}.brand{margin-bottom:8px}.nav{display:flex;overflow:auto;gap:5px}.side button{white-space:nowrap;width:auto}.side-account{margin-top:10px;padding-top:8px}.side-account #auth-identity{padding-bottom:4px}.side .side-account #logout{width:auto}.top{padding:14px}.content{padding:18px}.cards{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.media{grid-template-columns:repeat(2,1fr)}}
.settings-grid{display:grid;grid-template-columns:230px 1fr;gap:20px}.settings-menu{display:grid;align-content:start;gap:7px}.settings-menu button{border:0;background:#edf5fb;color:#163a5b;border-radius:8px;text-align:left;padding:12px;font-weight:600}.settings-menu button.selected{background:#0C83C3;color:#fff}.code-block{margin:0 0 18px}.code-block label{display:block;font-weight:700;margin-bottom:5px}.code-block .hint{color:#65758a;font-size:12px;margin:0 0 9px}.code-block textarea{width:100%;min-height:132px;background:#101e32;color:#d8edff;border:1px solid #304968;border-radius:9px;padding:15px;font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;resize:vertical}.code-footer{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.code-footer small{color:#65758a}@media(max-width:850px){.settings-grid{grid-template-columns:1fr}.settings-menu{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><style>#cms-app{display:none}#auth-screen{min-height:100vh;display:grid;place-items:center;background:#f5f8fc;padding:20px}#auth-box{width:min(100%,420px);background:#fff;border:1px solid #e3eaf2;border-radius:14px;padding:30px;box-shadow:0 15px 50px #15365315}#auth-box h1{color:#0C83C3;margin-bottom:8px}#auth-box input{display:block;width:100%;padding:12px;border:1px solid #ccd9e8;border-radius:7px;margin:10px 0}#auth-error{color:#b52d38;min-height:24px}#auth-submit{width:100%}#logout{background:transparent;color:#0C83C3;border:1px solid #0C83C3;border-radius:6px;padding:7px 12px;margin-left:12px}</style></head><body><section id="auth-screen"><div id="auth-box"><h1>MarketingCy CMS</h1><p>Secure administrator sign-in</p><form id="auth-form"><label for="auth-email">Email</label><input id="auth-email" type="email" autocomplete="username" required placeholder="ioannouleandros@gmail.com"><label for="auth-password">Password</label><input id="auth-password" type="password" autocomplete="current-password" required placeholder="Password"><p id="auth-error" role="alert"></p><button class="btn" id="auth-submit" type="submit">Sign in</button></form></div></section><div class="app" id="cms-app"><aside class="side"><div class="brand"><span>◆</span> MarketingCy <small>CMS</small></div><nav class="nav" id="nav"><button class="active" data-view="dashboard">▦ Dashboard</button><button data-view="pages">▤ Pages</button><button data-view="slider">▣ Homepage Slider</button><button data-view="blog">✎ Blog Posts</button><button data-view="services">◈ Services</button><button data-view="portfolio">▧ Portfolio</button><button data-view="media">▧ Media Library</button><button data-view="enquiries">✉ Enquiries</button><button data-view="seo">⌕ SEO</button><button data-view="navigation">☷ Navigation</button><button data-view="users">♙ Users & Roles</button><button data-view="settings">⚙ Settings</button></nav><div class="side-account"><span class="account-label">Signed in as</span><span id="auth-identity">Administrator</span><button id="logout" type="button">↪ Log out</button></div></aside><main class="main"><header class="top"><strong>MarketingCy Content Studio</strong><button id="top-logout" type="button" class="btn secondary">Sign out</button></header><div class="content"><div class="notice"><strong>CMS:</strong> Homepage Slider supports Supabase drafts, image uploads and publishing. Other CMS sections are still under development.</div><div id="view"></div></div></main></div>
<script src="./content-data.js"></script>
<script>
const pages=[{title:'Homepage',slug:'/',status:'Published',type:'Page'},{title:'Services',slug:'/services/',status:'Published',type:'Page'},{title:'SEO Cyprus',slug:'/seo-cyprus/',status:'Published',type:'Page'},{title:'Web Design',slug:'/web-development-cyprus/',status:'Published',type:'Page'},{title:'About Us',slug:'/about/',status:'Published',type:'Page'},{title:'Contact',slug:'/contact/',status:'Published',type:'Page'}];
const posts=[{title:'Your first MarketingCy article',slug:'your-first-article',status:'Draft',type:'Blog Post'}];
const imported=window.marketingcyImportedContent||[];
for(const item of imported){let page=pages.find(p=>p.slug===item.slug);if(!page){page={title:item.title.split('|')[0].trim(),slug:item.slug,status:'Published',type:'Page'};pages.push(page)}page.body=item.body;page.meta=item.meta;page.description=item.description}
let current='dashboard', editing=null;
let cmsStore=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rows(data){return '<table class="table"><thead><tr><th>Title</th><th>URL / Slug</th><th>Status</th><th>Action</th></tr></thead><tbody>'+data.map((p,i)=>'<tr><td><strong>'+esc(p.title)+'</strong></td><td class="muted">'+esc(p.slug)+'</td><td><span class="tag '+(p.status==='Draft'?'draft':'')+'">'+esc(p.status)+'</span></td><td><button class="btn secondary" onclick="editItem(\''+current+'\','+i+')">Edit</button></td></tr>').join('')+'</tbody></table>'}
function show(name){current=name;editing=null;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===name));render()}
function editItem(type,i){editing={type,i};render()}
function newItem(){editing={type:current,i:-1};render()}
function editor(){const data=editing.type==='blog'?posts:pages,p=editing.i<0?{title:'',slug:'',status:'Draft',type:'Page'}:data[editing.i];return '<div class="heading"><h1>'+ (editing.i<0?'Create':'Edit')+' '+(editing.type==='blog'?'Blog Post':'Page')+'</h1><button class="btn secondary" onclick="show(\''+editing.type+'\')">← Back</button></div><div class="panel fields"><div class="field"><label>Title</label><input id="title" value="'+esc(p.title)+'"></div><div class="field"><label>URL / Slug</label><input id="slug" value="'+esc(p.slug)+'"></div><div class="field"><label>Frontend hero heading</label><input id="heading" value="'+esc(p.heading||p.title)+'"></div><div class="field"><label>Frontend hero summary</label><textarea id="summary" style="min-height:90px">'+esc(p.summary||'')+'</textarea></div><div class="field"><label>Page content (published text updates; original design preserved)</label><textarea id="body" placeholder="Enter content here...">'+esc(p.body||'')+'</textarea></div><div class="field"><label>SEO title</label><input id="meta" value="'+esc(p.meta||'')+'" placeholder="Search result title"></div><div class="field"><label>Meta description</label><textarea id="description" style="min-height:90px" placeholder="Search result description">'+esc(p.description||'')+'</textarea></div><div class="actions"><button class="btn secondary" onclick="saveItem(\'Draft\')">Save draft</button><button class="btn" onclick="saveItem(\'Published\')">Publish to website</button></div></div>'}
async function saveItem(status){const d=editing.type==='blog'?posts:pages,p={title:document.getElementById('title').value.trim(),slug:document.getElementById('slug').value.trim(),status,type:editing.type==='blog'?'Blog Post':'Page',body:document.getElementById('body').value,meta:document.getElementById('meta').value,description:document.getElementById('description').value,heading:document.getElementById('heading').value,summary:document.getElementById('summary').value};if(!p.title){alert('Please enter a title');return}if(editing.type==='pages'&&cmsStore){try{const result=status==='Published'?await cmsStore.publish(p):await cmsStore.save(p);if(result.error){alert('Save failed: '+result.error.message);return}}catch(e){alert('Save failed. Please try again.');return}}if(editing.i<0)d.push(p);else d[editing.i]=p;show(editing.type)}

const customCode={head:'',bodyStart:'',bodyEnd:''};
function customCodeSettings(){return '<div class="heading"><div><h1>Settings</h1><p>Manage website-wide configuration.</p></div></div><div class="settings-grid"><div class="settings-menu"><button type="button" onclick="showSettingsOverview()">⚙ General</button><button type="button" class="selected">⌘ Custom Code</button></div><section class="panel"><h2>Custom Code</h2><p>Add global scripts for analytics, tracking pixels and integrations. These fields do not execute code inside the CMS.</p><div class="notice"><strong>Development preview:</strong> Code is saved only in this browser session. Nothing is injected into the public website or published.</div>'+[['head','Global &lt;head&gt;','Inserted inside the HTML head, e.g. GA4 or verification scripts.'],['bodyStart','After opening &lt;body&gt;','Inserted immediately after the opening body tag, e.g. Google Tag Manager noscript.'],['bodyEnd','Before closing &lt;/body&gt;','Inserted immediately before the closing body tag.']].map(([key,title,hint])=>'<div class="code-block"><label for="code-'+key+'">'+title+'</label><p class="hint">'+hint+'</p><textarea id="code-'+key+'" spellcheck="false" placeholder="<!-- Paste your trusted snippet here -->">'+esc(customCode[key])+'</textarea></div>').join('')+'<div class="code-footer"><button type="button" class="btn" onclick="saveCustomCode()">Save draft (session only)</button><small id="code-status" role="status">Not published · Admin-only feature</small></div></section></div>'}
function showSettingsOverview(){document.getElementById('view').innerHTML='<div class="heading"><h1>Settings</h1></div><div class="settings-grid"><div class="settings-menu"><button class="selected">⚙ General</button><button onclick="show(\'settings\')">⌘ Custom Code</button></div><section class="panel"><h2>General Settings</h2><p>General site configuration will be added in a later milestone.</p></section></div>'}
function saveCustomCode(){for(const key of Object.keys(customCode))customCode[key]=document.getElementById('code-'+key).value;document.getElementById('code-status').textContent='Draft saved in this browser session · Not published'}

let sliderRows=[],sliderSelected=1,sliderBusy=false;
async function renderSlider(){const v=document.getElementById('view');if(!window.marketingcySliderStore){v.innerHTML='<div class="panel">Sign in to load slider content.</div>';return}v.innerHTML='<div class="panel">Loading homepage slider…</div>';const result=await window.marketingcySliderStore.load();if(current!=='slider')return;if(result.error){v.textContent='Could not load slider: '+result.error.message;return}sliderRows=result.data||[];if(!sliderRows.some(x=>x.id===sliderSelected))sliderSelected=sliderRows[0]?.id||1;drawSlider()}
function drawSlider(){const v=document.getElementById('view'),row=sliderRows.find(x=>x.id===sliderSelected);if(!row){v.textContent='No slider data found';return}v.innerHTML='<div class="heading"><div><h1>Homepage Slider</h1><p>Only the right side of the hero changes. The left section stays fixed.</p></div><a class="btn secondary" href="/" target="_blank" rel="noopener">Open website ↗</a></div><div class="panel fields"><div class="actions">'+sliderRows.map(x=>'<button class="btn '+(x.id===sliderSelected?'':'secondary')+'" type="button" onclick="sliderSelect('+x.id+')">Slide '+String(x.id).padStart(2,'0')+'</button>').join('')+'<button class="btn secondary" type="button" onclick="addSlider()">+ Add Slide</button>'+'</div><div class="field"><label>Eyebrow</label><input id="sl-eyebrow" value="'+esc(row.eyebrow)+'"></div><div class="field"><label>Headline</label><input id="sl-headline" value="'+esc(row.headline)+'"></div><div class="field"><label>Highlighted headline</label><input id="sl-accent" value="'+esc(row.accent)+'"></div><div class="field"><label>Description</label><textarea id="sl-description" style="min-height:90px">'+esc(row.description)+'</textarea></div><div class="field"><label>Image URL</label><input id="sl-image" value="'+esc(row.image_url)+'"></div><div class="field"><label>Or upload replacement image (JPG, PNG, WebP; max 5MB)</label><input type="file" id="sl-upload" accept="image/jpeg,image/png,image/webp"></div><div class="field"><label>Image preview</label><img id="sl-preview" alt="Selected slide" style="width:100%;max-width:620px;max-height:240px;object-fit:cover;border-radius:10px" src="'+esc(row.image_url)+'"></div><div class="actions"><button class="btn secondary" id="sl-save" onclick="sliderSave(false)">Save Draft</button><button class="btn" id="sl-publish" onclick="sliderSave(true)">Publish Slide to Website</button></div><p id="sl-message" role="status"></p></div>';document.getElementById('sl-image').addEventListener('change',e=>{document.getElementById('sl-preview').src=e.target.value})}
function sliderSelect(id){sliderSelected=id;drawSlider()}
async function addSlider(){const id=Math.max(0,...sliderRows.map(x=>x.id))+1;if(id>10){alert('Maximum 10 slides supported.');return}const row={id,eyebrow:'NEW SLIDE',headline:'New headline',accent:'Highlighted text',description:'Describe your new slide.',image_url:''};sliderRows.push(row);sliderSelected=id;drawSlider();document.getElementById('sl-message').textContent='New slide: upload an image, then Save Draft or Publish. Nothing is live yet.'}
async function sliderSave(publish){if(sliderBusy)return;sliderBusy=true;const msg=document.getElementById('sl-message');msg.textContent='Saving…';document.getElementById('sl-save').disabled=true;document.getElementById('sl-publish').disabled=true;try{const row={id:sliderSelected,eyebrow:document.getElementById('sl-eyebrow').value.trim(),headline:document.getElementById('sl-headline').value.trim(),accent:document.getElementById('sl-accent').value.trim(),description:document.getElementById('sl-description').value.trim(),image_url:document.getElementById('sl-image').value.trim()};const file=document.getElementById('sl-upload').files[0];if(file)row.image_url=await window.marketingcySliderStore.upload(file,row.id);if(!row.image_url)throw Error('Please choose an image');if(!row.headline)throw Error('Headline is required');const result=publish?await window.marketingcySliderStore.publish(row):await window.marketingcySliderStore.save(row);if(result.error)throw result.error;const index=sliderRows.findIndex(x=>x.id===row.id);sliderRows[index]=row;document.getElementById('sl-image').value=row.image_url;document.getElementById('sl-preview').src=row.image_url;document.getElementById('sl-upload').value='';msg.textContent=publish?'Published! Refresh the homepage to see the change.':'Draft saved in Supabase. The public slide is unchanged.'}catch(e){msg.textContent='Error: '+e.message}finally{sliderBusy=false;document.getElementById('sl-save').disabled=false;document.getElementById('sl-publish').disabled=false}}

let seoFiles=[],seoRedirects=[],seoTab='robots';
async function renderSeo(){const v=document.getElementById('view');v.innerHTML='<div class="panel">Loading SEO settings…</div>';try{[seoFiles,seoRedirects]=await Promise.all([window.marketingcySeoStore.files(),window.marketingcySeoStore.redirects()]);if(current==='seo')drawSeo()}catch(e){v.textContent='SEO Manager unavailable: '+e.message}}
function seoSelect(t){const input=document.getElementById('seo-code');if(input&&seoTab!=='redirects'){const item=seoFiles.find(x=>x.key===seoTab);if(item)item.draft=input.value}seoTab=t;drawSeo()}
function drawSeo(){const v=document.getElementById('view'),item=seoFiles.find(x=>x.key===seoTab);v.innerHTML='<div class="heading"><div><h1>SEO Control Center</h1><p>Technical SEO settings, editable code and redirects.</p></div></div><div class="panel"><div class="actions" style="flex-wrap:wrap">'+['robots','llms','schema','sitemap','redirects'].map(t=>'<button class="btn '+(seoTab===t?'':'secondary')+'" onclick="seoSelect(\''+t+'\')">'+(t==='redirects'?'301 Redirects':t==='schema'?'Schema JSON-LD':t+'.'+(t==='sitemap'?'xml':'txt'))+'</button>').join('')+'</div></div>'+(seoTab==='redirects'?'<div class="panel" style="margin-top:15px"><h2>301 Redirects</h2><p>Rules are stored in Supabase. HTTP redirect execution is not yet connected.</p><div class="field"><label>Old path</label><input id="seo-old" placeholder="/old-page/"></div><div class="field"><label>Destination path or HTTPS URL</label><input id="seo-new" placeholder="/new-page/"></div><button class="btn" onclick="seoAddRedirect()">Add Redirect</button><p id="seo-status"></p>'+seoRedirects.map(x=>'<div class="actions" style="margin-top:10px"><code>'+esc(x.source)+' → '+esc(x.destination)+'</code><button class="btn secondary" onclick="seoDeleteRedirect('+x.id+')">Delete</button></div>').join('')+'</div>':'<div class="panel fields" style="margin-top:15px"><h2>'+(seoTab==='schema'?'Schema JSON-LD':seoTab+'.'+(seoTab==='sitemap'?'xml':'txt'))+'</h2><p>'+ (seoTab==='sitemap'?'XML editor. Automatic sitemap generation is not yet connected.':'Draft and published versions are stored in Supabase.')+'</p><div class="field"><label>Code / text</label><textarea id="seo-code" rows="17" spellcheck="false" style="font-family:monospace">'+esc(item?.draft||'')+'</textarea></div><div class="actions"><button class="btn secondary" onclick="seoSave(false)">Save Draft</button><button class="btn" onclick="seoSave(true)">Publish Settings</button></div><p id="seo-status" role="status"></p><p style="font-size:12px">Publishing stores the live version in Supabase; public file endpoints and schema injection are not yet connected.</p></div>')}
async function seoSave(publish){const status=document.getElementById('seo-status'),value=document.getElementById('seo-code').value;try{if(seoTab==='schema')JSON.parse(value);if(seoTab==='sitemap'&&value.trim()&&!value.includes('<urlset'))throw Error('Sitemap must contain a urlset element');if(seoTab==='robots'&&/Disallow:\s*\/\s*$/m.test(value)&&!confirm('This may block crawling of the entire website. Continue?'))return;await window.marketingcySeoStore.save(seoTab,value,publish);const item=seoFiles.find(x=>x.key===seoTab);item.draft=value;if(publish)item.published=value;status.textContent=publish?'Published settings saved to Supabase. Public endpoints are not connected yet.':'Draft saved.'}catch(e){status.textContent='Error: '+e.message}}
async function seoAddRedirect(){const source=document.getElementById('seo-old').value.trim(),destination=document.getElementById('seo-new').value.trim(),status=document.getElementById('seo-status');if(!/^\/(?!\/)/.test(source)||!(/^(https:\/\/|\/(?!\/))/.test(destination))){status.textContent='Use an internal /old-path/ and a /new-path/ or HTTPS destination.';return}if(source===destination){status.textContent='Source and destination must differ.';return}try{await window.marketingcySeoStore.addRedirect(source,destination);seoRedirects=await window.marketingcySeoStore.redirects();drawSeo()}catch(e){status.textContent='Error: '+e.message}}
async function seoDeleteRedirect(id){if(!confirm('Delete this redirect rule?'))return;try{await window.marketingcySeoStore.removeRedirect(id);seoRedirects=await window.marketingcySeoStore.redirects();drawSeo()}catch(e){alert(e.message)}}
const mediaCategories=['Brand Images','Website Photos','Case Studies','Blog Images'];let mediaItems=[],mediaFilter='All Media',mediaSearch='';
async function renderMedia(){const v=document.getElementById('view');v.innerHTML='<div class="panel">Loading media…</div>';try{mediaItems=await window.marketingcyMediaStore.list();if(current==='media')drawMedia()}catch(e){v.textContent='Media Library unavailable: '+e.message}}
function drawMedia(){const v=document.getElementById('view');const filtered=mediaItems.filter(m=>(mediaFilter==='All Media'||m.category===mediaFilter)&&(((m.name||'')+' '+(m.alt_text||'')).toLowerCase().includes(mediaSearch.toLowerCase())));v.innerHTML='<div class="heading"><div><h1>Media Library</h1><p>Upload, organize and reuse website assets.</p></div></div><div class="panel fields"><div class="field"><label>Upload to category</label><select id="media-upload-category">'+mediaCategories.map(c=>'<option>'+c+'</option>').join('')+'</select></div><div class="field"><label>Select files (JPG, PNG, WebP, GIF, SVG, PDF or TXT; 10MB each)</label><input type="file" id="media-upload-files" multiple accept="image/jpeg,image/png,image/webp,image/gif,image/svg+xml,application/pdf,text/plain"></div><div class="actions"><button class="btn" type="button" onclick="uploadMedia()">Upload Files</button></div><p id="media-status" role="status"></p></div><div class="panel" style="margin-top:14px"><div class="actions" style="flex-wrap:wrap">'+['All Media',...mediaCategories].map(c=>'<button type="button" class="btn '+(mediaFilter===c?'':'secondary')+'" onclick="setMediaFilter(\''+c+'\')">'+c+' ('+mediaItems.filter(m=>c==='All Media'||m.category===c).length+')</button>').join('')+'</div><div class="field" style="margin-top:12px"><label>Search files</label><input id="media-search" placeholder="Search by filename" value="'+esc(mediaSearch)+'" oninput="mediaSearch=this.value;drawMedia()"></div></div><div class="cards" style="margin-top:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))">'+filtered.map(m=>'<div class="panel" style="min-width:0;padding:12px">'+(m.mime_type&&m.mime_type.startsWith('image/')?'<img loading="lazy" src="'+esc(m.url)+'" alt="" style="width:100%;height:140px;object-fit:contain;background:#edf6fc;border-radius:7px">':'<div style="height:140px;display:grid;place-items:center;background:#edf6fc;border-radius:7px">📄 File</div>')+'<p style="overflow-wrap:anywhere"><strong>'+esc(m.name)+'</strong></p><p style="font-size:12px">'+esc(m.category)+'</p>'+(m.mime_type&&m.mime_type.startsWith("image/")?'<div class="field" style="margin:10px 0"><label for="media-alt-'+m.id+'">Image alt text</label><input id="media-alt-'+m.id+'" type="text" maxlength="300" value="'+esc(m.alt_text||"")+'" placeholder="Describe this image" style="width:100%"><button class="btn secondary" type="button" style="margin-top:7px" onclick="saveMediaAlt('+m.id+')">Save Alt Text</button></div>':"")+'<select aria-label="Change category" onchange="changeMediaCategory('+m.id+',this.value)">'+mediaCategories.map(c=>'<option '+(m.category===c?'selected':'')+'>'+c+'</option>').join('')+'</select><div class="actions" style="margin-top:10px;flex-wrap:wrap"><button class="btn secondary" type="button" onclick="navigator.clipboard.writeText(\''+m.url.replace(/'/g,'%27')+'\')">Copy URL</button><a class="btn secondary" href="'+esc(m.url)+'" target="_blank" rel="noopener">Open</a><button class="btn secondary" type="button" onclick="deleteMedia('+m.id+')">Delete</button></div></div>').join('')+'</div>'+(filtered.length?'':'<div class="panel" style="margin-top:12px">No files found.</div>')}
function setMediaFilter(c){mediaFilter=c;drawMedia()}
async function uploadMedia(){const input=document.getElementById('media-upload-files'),files=[...input.files],category=document.getElementById('media-upload-category').value,status=document.getElementById('media-status');if(!files.length){status.textContent='Choose files first.';return}let success=0;for(const f of files){status.textContent='Uploading '+(success+1)+' / '+files.length+': '+f.name;try{await window.marketingcyMediaStore.upload(f,category);success++}catch(e){status.textContent='Uploaded '+success+' file(s). Failed on '+f.name+': '+e.message;return}}mediaItems=await window.marketingcyMediaStore.list();drawMedia();document.getElementById('media-status').textContent=success+' file(s) uploaded successfully.'}
async function saveMediaAlt(id){const input=document.getElementById('media-alt-'+id);if(!input)return;const text=input.value.trim();try{await window.marketingcyMediaStore.update(id,{alt_text:text});const m=mediaItems.find(x=>x.id===id);if(m)m.alt_text=text;const btn=input.nextElementSibling;btn.textContent='Saved ✓';setTimeout(()=>{if(btn.isConnected)btn.textContent='Save Alt Text'},1800)}catch(e){alert('Could not save alt text: '+e.message)}}
async function changeMediaCategory(id,category){try{await window.marketingcyMediaStore.update(id,{category});const m=mediaItems.find(x=>x.id===id);if(m)m.category=category;drawMedia()}catch(e){alert('Category update failed: '+e.message)}}
async function deleteMedia(id){const item=mediaItems.find(x=>x.id===id);if(!item)return;const used=await Promise.resolve();if(!confirm('Remove '+item.name+' from the Media Library? Files hosted elsewhere will only be unlisted. Check whether any published page uses this image before deleting.'))return;try{await window.marketingcyMediaStore.remove(item);mediaItems=mediaItems.filter(x=>x.id!==id);drawMedia()}catch(e){alert('Delete failed: '+e.message)}}
let portfolioRows=[],portfolioBusy=false;
async function renderPortfolio(){const v=document.getElementById('view');v.innerHTML='<div class="panel">Loading portfolio…</div>';try{portfolioRows=await window.marketingcyPortfolioStore.load();if(current==='portfolio')drawPortfolio()}catch(e){v.textContent='Portfolio unavailable: '+e.message}}
async function deletePortfolio(id){const p=portfolioRows.find(x=>x.id===id);if(!p)return;if(!confirm('Delete '+p.title+' from both homepage and Portfolio page? This cannot be undone.'))return;try{await window.marketingcyPortfolioStore.remove(id);portfolioRows=portfolioRows.filter(x=>x.id!==id);drawPortfolio();document.getElementById('portfolio-status').textContent='Project deleted from drafts and published website.'}catch(e){alert('Delete failed: '+e.message)}}
function addPortfolio(){const id=Math.max(0,...portfolioRows.map(x=>x.id))+1;portfolioRows.push({id,title:'New Project',display_name:'New Project',category:'WEBSITE DESIGN',description:'',image_url:'',project_url:'',show_home:false,show_portfolio:true,home_order:id,portfolio_order:id});drawPortfolio()}
function drawPortfolio(){const v=document.getElementById('view');v.innerHTML='<div class="heading"><div><h1>Portfolio Manager</h1><p>Manage both homepage and Portfolio page. Drafts do not change the live site.</p></div><button class="btn" onclick="addPortfolio()">+ Add Project</button></div><div class="panel"><div class="actions"><a class="btn secondary" href="/#portfolio" target="_blank">Homepage ↗</a><a class="btn secondary" href="/our-work/" target="_blank">Portfolio page ↗</a></div></div>'+portfolioRows.map((p,i)=>'<div class="panel fields" style="margin-top:14px"><div class="actions" style="justify-content:space-between"><h2>Project '+(i+1)+'</h2><button type="button" class="btn secondary" onclick="deletePortfolio('+p.id+')">Delete Project</button></div><div class="field"><label>Project title</label><input data-port="'+i+'" data-key="title" value="'+esc(p.title)+'"></div><div class="field"><label>Image overlay name</label><input data-port="'+i+'" data-key="display_name" value="'+esc(p.display_name)+'"></div><div class="field"><label>Category</label><input data-port="'+i+'" data-key="category" value="'+esc(p.category)+'"></div><div class="field"><label>Description (optional)</label><textarea data-port="'+i+'" data-key="description">'+esc(p.description||'')+'</textarea></div><div class="field"><label>Image URL</label><input data-port="'+i+'" data-key="image_url" value="'+esc(p.image_url)+'"></div><div class="field"><label>Upload image (JPG/PNG/WebP, max 5MB)</label><input type="file" accept="image/jpeg,image/png,image/webp" data-port="'+i+'" data-key="upload"><button type="button" class="btn secondary" onclick="uploadPortfolioImage('+i+')">Upload Image</button><small data-port="'+i+'" data-key="upload-status"></small></div><div class="field"><label>Original project URL</label><input data-port="'+i+'" data-key="project_url" value="'+esc(p.project_url)+'"></div><div class="actions"><label><input type="checkbox" data-port="'+i+'" data-key="show_home" '+(p.show_home?'checked':'')+'> Show on Homepage</label><label><input type="checkbox" data-port="'+i+'" data-key="show_portfolio" '+(p.show_portfolio?'checked':'')+'> Show on Portfolio Page</label></div><div class="actions"><div class="field"><label>Homepage order</label><input type="number" min="1" data-port="'+i+'" data-key="home_order" value="'+p.home_order+'"></div><div class="field"><label>Portfolio order</label><input type="number" min="1" data-port="'+i+'" data-key="portfolio_order" value="'+p.portfolio_order+'"></div></div></div>').join('')+'<div class="panel" style="margin-top:16px"><div class="actions"><button class="btn secondary" onclick="savePortfolio(false)">Save Draft</button><button class="btn" onclick="savePortfolio(true)">Publish to Website</button></div><p id="portfolio-status" role="status"></p></div>'}
async function uploadPortfolioImage(i){const get=k=>document.querySelector('[data-port="'+i+'"][data-key="'+k+'"]');const file=get('upload').files[0],status=get('upload-status');if(!file){status.textContent='Choose an image first.';return}status.textContent='Uploading…';try{const url=await window.marketingcyPortfolioStore.upload(file,portfolioRows[i].id);get('image_url').value=url;get('upload').value='';status.textContent='Image uploaded successfully. Save Draft or Publish to apply.'}catch(e){status.textContent='Upload failed: '+e.message}}
async function savePortfolio(publish){if(portfolioBusy)return;portfolioBusy=true;const status=document.getElementById('portfolio-status');status.textContent='Saving…';try{const rows=[];for(let i=0;i<portfolioRows.length;i++){const get=k=>document.querySelector('[data-port="'+i+'"][data-key="'+k+'"]');const row={...portfolioRows[i]};for(const k of ['title','display_name','category','description','image_url','project_url'])row[k]=get(k).value.trim();for(const k of ['show_home','show_portfolio'])row[k]=get(k).checked;for(const k of ['home_order','portfolio_order'])row[k]=Math.max(1,Number(get(k).value)||i+1);const file=get('upload').files[0];if(file)row.image_url=await window.marketingcyPortfolioStore.upload(file,row.id);if(!row.title||!row.image_url||!row.project_url)throw Error('Project '+(i+1)+' ('+(row.title||'Untitled')+') is missing: '+[!row.title?'title':null,!row.image_url?'image (upload or enter URL)':null,!row.project_url?'original project URL':null].filter(Boolean).join(', '));if(!/^https:\/\//.test(row.image_url)&&!/^\/(?!\/)/.test(row.image_url))throw Error('Image must use HTTPS or an internal path');if(!/^https:\/\//i.test(row.project_url)&&!/^\/(?!\/)/.test(row.project_url)){if(/^(?:www\.)?[a-z0-9][a-z0-9.-]*\.[a-z]{2,}(?::[0-9]+)?(?:[/?#][^\s]*)?$/i.test(row.project_url))row.project_url='https://'+row.project_url;else throw Error('Project '+(i+1)+' ('+row.title+'): enter a valid website address such as www.example.com or an internal path starting with /')}get('project_url').value=row.project_url;rows.push(row)}await window.marketingcyPortfolioStore.save(rows,publish);portfolioRows=rows;status.textContent=publish?'Published to both connected pages. Refresh to see updates.':'Draft saved; live pages unchanged.'}catch(e){status.textContent='Error: '+e.message}finally{portfolioBusy=false}}
let serviceData=null,serviceBusy=false;
async function renderServices(){const v=document.getElementById('view');v.innerHTML='<div class="panel">Loading services…</div>';try{serviceData=await window.marketingcyServicesStore.load();if(current==='services')drawServices()}catch(e){v.textContent='Could not load services: '+e.message}}
function drawServices(){const v=document.getElementById('view');if(!serviceData)return;const s=serviceData.section;v.innerHTML='<div class="heading"><h1>Homepage Services</h1><a class="btn secondary" href="/#services" target="_blank">View website ↗</a></div><div class="panel fields"><div class="field"><label>Section eyebrow</label><input id="svc-eyebrow" value="'+esc(s.eyebrow)+'"></div><div class="field"><label>Section heading</label><input id="svc-heading" value="'+esc(s.heading)+'"></div><div class="field"><label>Section description</label><textarea id="svc-desc">'+esc(s.description)+'</textarea></div></div>'+serviceData.cards.map((c,i)=>'<div class="panel fields" style="margin-top:15px"><h2>Service '+(i+1)+'</h2><div class="field"><label>Title</label><input data-service="'+i+'" data-key="title" value="'+esc(c.title)+'"></div><div class="field"><label>Description</label><textarea data-service="'+i+'" data-key="description">'+esc(c.description)+'</textarea></div><div class="field"><label>Learn more URL</label><input data-service="'+i+'" data-key="link" value="'+esc(c.link)+'"></div><div class="field"><label>Icon</label><select data-service="'+i+'" data-key="icon">'+['search','monitor','chart','users','mail'].map(x=>'<option value="'+x+'" '+(c.icon===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>Display order</label><input type="number" min="1" data-service="'+i+'" data-key="sort_order" value="'+c.sort_order+'"></div><label><input type="checkbox" data-service="'+i+'" data-key="visible" '+(c.visible?'checked':'')+'> Show this card</label></div>').join('')+'<div class="panel" style="margin-top:15px"><div class="actions"><button class="btn secondary" type="button" onclick="addService()">+ Add Service</button><button class="btn secondary" onclick="saveServices(false)">Save Draft</button><button class="btn" onclick="saveServices(true)">Publish to Website</button></div><p id="svc-message" role="status"></p></div>'}
function addService(){if(!serviceData)return;const id=Math.max(0,...serviceData.cards.map(c=>c.id))+1;serviceData.cards.push({id,title:'New Service',description:'',link:'#',icon:'search',sort_order:serviceData.cards.length+1,visible:true});drawServices();document.getElementById('svc-message').textContent='New service added to editor. Set its title and link, then save or publish.'}
async function saveServices(publish){if(serviceBusy)return;serviceBusy=true;const msg=document.getElementById('svc-message');msg.textContent='Saving…';try{const cards=serviceData.cards.map((c,i)=>{const get=k=>document.querySelector('[data-service="'+i+'"][data-key="'+k+'"]');return {...c,title:get('title').value.trim(),description:get('description').value.trim(),link:get('link').value.trim(),icon:get('icon').value,sort_order:Number(get('sort_order').value)||i+1,visible:get('visible').checked}});if(cards.some(c=>!c.title||!c.link||!/^\/(?!\/)/.test(c.link)&&!/^https:\/\//.test(c.link)))throw Error('Each service needs a title and valid internal URL or HTTPS link');const section={...serviceData.section,eyebrow:document.getElementById('svc-eyebrow').value.trim(),heading:document.getElementById('svc-heading').value.trim(),description:document.getElementById('svc-desc').value.trim()};await window.marketingcyServicesStore.save(cards,section,publish);serviceData={cards,section};msg.textContent=publish?'Published! Refresh the website to see changes.':'Draft saved.'}catch(e){msg.textContent='Save failed: '+e.message}finally{serviceBusy=false}}
function render(){const v=document.getElementById('view');if(current==='slider'){renderSlider();return}if(current==='services'){renderServices();return}if(current==='portfolio'){renderPortfolio();return}if(current==='media'){renderMedia();return}if(current==='seo'){renderSeo();return}if(editing){v.innerHTML=editor();return}const headings={pages:'Pages',blog:'Blog Posts',services:'Services',portfolio:'Portfolio',media:'Media Library',enquiries:'Forms & Enquiries',seo:'SEO Management',navigation:'Navigation',users:'Users & Roles',settings:'Settings'};if(current==='settings'){v.innerHTML=customCodeSettings();return}if(current==='dashboard'){v.innerHTML='<div class="heading"><div><h1>Good morning!</h1><p>Manage your MarketingCy website from one place.</p></div><button class="btn" onclick="show(\'pages\')">Manage content</button></div><div class="cards"><div class="card"><strong>'+pages.length+'</strong><span>Pages (sample)</span></div><div class="card"><strong>'+posts.length+'</strong><span>Blog posts (sample)</span></div><div class="card"><strong>5</strong><span>Services (connected)</span></div><div class="card"><strong>—</strong><span>New enquiries (not connected)</span></div></div><div class="two"><section class="panel"><h2>Recent content</h2>'+rows(pages.slice(0,5))+'</section><section class="panel"><h2>Quick actions</h2><button class="quick" onclick="show(\'blog\');newItem()">＋ Create blog post</button><button class="quick" onclick="show(\'pages\')">✎ Edit a page</button><button class="quick" onclick="show(\'media\')">▧ Media library</button><button class="quick" onclick="show(\'enquiries\')">✉ View enquiries</button></section></div>';return}if(current==='pages'||current==='blog'){v.innerHTML='<div class="heading"><h1>'+headings[current]+'</h1><button class="btn" onclick="newItem()">＋ New '+(current==='blog'?'post':'page')+'</button></div><section class="panel">'+rows(current==='blog'?posts:pages)+'</section>';return}if(current==='media'){v.innerHTML='<div class="heading"><h1>Media Library</h1><button class="btn" onclick="alert(\'Uploads will be enabled after storage and authentication are configured.\')">Upload media</button></div><section class="panel"><p>Sample media placeholders. No files are uploaded or stored in this prototype.</p><div class="media"><div>Brand images</div><div>Website photos</div><div>Case studies</div><div>Blog images</div></div></section>';return}const descriptions={services:'Manage service descriptions, features and calls to action.',portfolio:'Manage case studies, client work and testimonials.',enquiries:'Private form submissions will appear here once the secure backend is configured.',seo:'Manage SEO titles, descriptions, canonical URLs and social sharing images.',navigation:'Edit header and footer menus and their display order.',users:'Secure accounts, role-based permissions and multi-factor authentication require backend setup.',settings:'Configure site settings, publishing workflow and integrations.'};v.innerHTML='<div class="heading"><h1>'+headings[current]+'</h1></div><section class="panel"><h2>'+headings[current]+'</h2><p>'+descriptions[current]+'</p><p><strong>Planned feature:</strong> This section is a design placeholder, not a functioning backend.</p></section>'}
window.cmsConnect=async function(store){cmsStore=store;try{const result=await store.load();if(result.error)throw result.error;for(const row of result.data||[]){let p=pages.find(p=>p.slug===row.slug);if(!p){p={slug:row.slug,type:'Page'};pages.push(p)}p.title=row.title;p.body=row.draft_body;p.meta=row.draft_seo_title;p.description=row.draft_meta_description;p.heading=row.draft_heading;p.summary=row.draft_summary;p.status=row.status==='published'?'Published':'Draft'}document.querySelector('.notice').textContent='CMS drafts save to Supabase. Publishing updates connected homepage text, hero heading, summary and SEO. Existing layout and unmatched text stay unchanged; adding or deleting whole sections requires a structured editor.';render()}catch(e){document.querySelector('.notice').textContent='Database loading failed. Changes cannot be saved permanently until the connection is restored.'}};
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.view)));render();
</script><script type="module" src="./auth.js?v=backend-login-restored-1"></script></body></html>
