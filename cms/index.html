<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarketingCy CMS — Development Prototype</title>
<style>
:root{--blue:#0C83C3;--navy:#102b4c;--muted:#65758a;--line:#e3eaf2;--bg:#f5f8fc}*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,Arial,sans-serif;background:var(--bg);color:var(--navy)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:244px 1fr;min-height:100vh}.side{background:#0c213e;color:white;padding:24px 16px}.brand{font-size:21px;font-weight:800;margin-bottom:32px}.brand span{color:#4ab9f2}.side button{display:block;width:100%;background:transparent;color:#cbd8e9;border:0;text-align:left;padding:12px 14px;border-radius:8px;margin:3px 0}.side button.active,.side button:hover{background:var(--blue);color:white}.side{display:flex;flex-direction:column}.side .nav{flex:1}.side-account{border-top:1px solid #ffffff25;margin-top:24px;padding-top:15px}.side-account .account-label{display:block;color:#9eb4cf;font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:0 14px 5px}.side-account #auth-identity{display:block;color:#fff;overflow-wrap:anywhere;font-size:12px;padding:0 14px 8px}.side .side-account #logout{display:block;width:100%;margin:0;background:transparent;color:#cbd8e9;border:0;text-align:left;padding:12px 14px;border-radius:8px}.side .side-account #logout:hover{background:#0C83C3;color:#fff}.main{min-width:0}.top{background:white;padding:19px 30px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.top small{color:var(--muted)}.content{padding:28px 30px;max-width:1300px;margin:auto}.heading{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}h1{font-size:27px;margin:0}h2{font-size:17px;margin:0 0 16px}p{color:var(--muted)}.btn{border:0;background:var(--blue);color:white;padding:10px 17px;border-radius:7px;font-weight:700}.btn.secondary{background:#e9f5fb;color:var(--blue)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:24px}.card,.panel{background:white;border:1px solid var(--line);border-radius:11px;padding:20px;box-shadow:0 5px 16px #15365308}.card strong{font-size:29px;display:block}.card span{color:var(--muted)}.two{display:grid;grid-template-columns:2fr 1fr;gap:20px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 10px;text-align:left;border-bottom:1px solid var(--line)}.table th{font-size:12px;color:var(--muted)}.tag{background:#e2f7eb;color:#14753c;padding:4px 8px;border-radius:5px;font-size:11px}.tag.draft{background:#fff4df;color:#95610d}.quick{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:white;padding:13px;color:var(--navy)}.quick:hover{color:var(--blue)}.fields{display:grid;gap:14px;max-width:820px}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #ccd9e8;border-radius:7px;background:white}.field textarea{min-height:170px;resize:vertical}.notice{background:#e9f5fb;border:1px solid #b7e1f6;color:#205675;padding:13px 16px;border-radius:8px;margin-bottom:20px}.media{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.media div{background:linear-gradient(145deg,#dceef9,#a9d6f0);height:130px;border-radius:9px;display:grid;place-items:center;color:#205675}.hidden{display:none}.actions{display:flex;gap:10px;flex-wrap:wrap}.muted{color:var(--muted)}@media(max-width:850px){.app{grid-template-columns:1fr}.side{padding:14px}.brand{margin-bottom:8px}.nav{display:flex;overflow:auto;gap:5px}.side button{white-space:nowrap;width:auto}.side-account{margin-top:10px;padding-top:8px}.side-account #auth-identity{padding-bottom:4px}.side .side-account #logout{width:auto}.top{padding:14px}.content{padding:18px}.cards{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.media{grid-template-columns:repeat(2,1fr)}}
.settings-grid{display:grid;grid-template-columns:230px 1fr;gap:20px}.settings-menu{display:grid;align-content:start;gap:7px}.settings-menu button{border:0;background:#edf5fb;color:#163a5b;border-radius:8px;text-align:left;padding:12px;font-weight:600}.settings-menu button.selected{background:#0C83C3;color:#fff}.code-block{margin:0 0 18px}.code-block label{display:block;font-weight:700;margin-bottom:5px}.code-block .hint{color:#65758a;font-size:12px;margin:0 0 9px}.code-block textarea{width:100%;min-height:132px;background:#101e32;color:#d8edff;border:1px solid #304968;border-radius:9px;padding:15px;font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;resize:vertical}.code-footer{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.code-footer small{color:#65758a}@media(max-width:850px){.settings-grid{grid-template-columns:1fr}.settings-menu{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* Forms and enquiries dashboard */
.enq-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:22px 0}.enq-stat{display:flex;align-items:center;gap:15px;background:#fff;border:1px solid #dce7f3;border-radius:13px;padding:18px;box-shadow:0 5px 16px #15365308}.enq-stat .symbol{font-size:23px;display:grid;place-items:center;width:47px;height:47px;background:#e7f3ff;border-radius:12px}.enq-stat strong{font-size:25px;display:block;line-height:1.2}.enq-stat small{color:#52647e}.enq-tools{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 20px}.enq-tools input,.enq-tools select{padding:12px;border:1px solid #d1dfee;border-radius:9px;background:#fff;color:#102b4c;min-width:150px}.enq-tools input{flex:2;min-width:220px}.enq-row{background:#fff;border:1px solid #dce7f3;border-left:5px solid #1689ed;border-radius:13px;padding:19px 22px;margin-bottom:14px;display:grid;grid-template-columns:minmax(170px,1fr) minmax(210px,1.3fr) minmax(190px,1fr) auto;gap:20px;align-items:center;box-shadow:0 4px 15px #15365308}.enq-row.contact{border-left-color:#24bd83}.enq-name{font-weight:750;font-size:15px}.enq-sub{color:#52647e;font-size:13px;margin-top:7px;overflow-wrap:anywhere}.enq-pill{display:inline-block;background:#eeeaff;color:#4630a8;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700}.enq-row.contact .enq-pill{background:#def8ef;color:#087958}.enq-message{background:#e9f9f6;border-radius:9px;padding:10px;margin-top:10px;white-space:pre-wrap;overflow-wrap:anywhere}.enq-actions{display:flex;gap:7px}.enq-actions button,.enq-actions a{border:1px solid #d4e2f2;border-radius:8px;background:#fff;padding:9px 11px;color:#0d66af;cursor:pointer;text-decoration:none}.enq-actions button:hover,.enq-actions a:hover{background:#eaf5ff}.enq-detail{grid-column:1/-1;border-top:1px solid #e2eaf3;padding-top:14px;white-space:pre-wrap;overflow-wrap:anywhere}.enq-empty{padding:26px;text-align:center;background:#fff;border:1px solid #dce7f3;border-radius:12px}@media(max-width:1100px){.enq-row{grid-template-columns:1fr 1fr}.enq-stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.enq-row{grid-template-columns:1fr}.enq-stats{grid-template-columns:1fr}}
.enq-management{margin-top:20px;padding:20px;border:1px solid #dce7f2;border-radius:16px;background:linear-gradient(145deg,#f8fbff,#f0f6fc);white-space:normal}.enq-management-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:19px}.enq-management-head strong{font-size:15px;color:#16365a;letter-spacing:-.2px}.enq-management-head span{font-size:12px;color:#74869a}.enq-management-fields{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px}.enq-field{min-width:0}.enq-field-title{display:flex;align-items:center;gap:7px;color:#647b96;font-size:11px;font-weight:800;letter-spacing:1.1px;margin-bottom:10px}.enq-field-icon{color:#2685d2;font-size:16px;line-height:1}.enq-segments{display:flex;flex-wrap:wrap;gap:7px}.enq-segment{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid #d8e4ef;border-radius:9px;background:#fff;color:#52677d;padding:9px 12px;min-height:38px;font-size:12px;font-weight:700;line-height:1.1;cursor:pointer;transition:background .15s,border-color .15s,box-shadow .15s,transform .15s}.enq-segment:hover{border-color:#78b4e5;background:#eef7ff;transform:translateY(-1px)}.enq-segment:focus-visible{outline:3px solid #7dbcf1;outline-offset:2px}.enq-segment.is-active{background:#e6f2ff;border-color:#3995df;color:#1264a8;box-shadow:0 0 0 1px #3995df inset}.enq-segment-dot{width:7px;height:7px;border-radius:50%;background:#a8b8c9;flex-shrink:0}.enq-segment.is-active .enq-segment-dot{background:#2389d6}.enq-segment.enq-status-replied.is-active,.enq-segment.enq-status-converted.is-active,.enq-segment.enq-priority-low.is-active{background:#e8f8ef;border-color:#36aa73;color:#16734a;box-shadow:0 0 0 1px #36aa73 inset}.enq-segment.enq-status-replied.is-active .enq-segment-dot,.enq-segment.enq-status-converted.is-active .enq-segment-dot{background:#20a369}.enq-segment.enq-status-in-progress.is-active,.enq-segment.enq-priority-medium.is-active{background:#fff4e3;border-color:#e3a23a;color:#9a5d08;box-shadow:0 0 0 1px #e3a23a inset}.enq-segment.enq-status-in-progress.is-active .enq-segment-dot{background:#d79527}.enq-segment.enq-priority-high.is-active{background:#fff0f0;border-color:#e97878;color:#b53030;box-shadow:0 0 0 1px #e97878 inset}.enq-segment.enq-status-closed.is-active{background:#eef1f5;border-color:#9baabb;color:#546273;box-shadow:0 0 0 1px #9baabb inset}@media(max-width:780px){.enq-management-fields{grid-template-columns:1fr}.enq-management{padding:15px}.enq-management-head{align-items:flex-start;flex-direction:column;gap:4px}}.nav-preview{background:#071f32;color:#fff;border-radius:12px;padding:20px;margin:18px 0}.nav-preview small{color:#9db8cb;letter-spacing:.1em}.nav-preview>div{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px}.nav-list{display:grid;gap:9px}.nav-entry{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #e0e8f2;border-radius:11px;background:#fff}.nav-entry .btn{padding:7px 10px}.nav-grip{color:#8a9bb1;font-size:22px}.nav-info{flex:1;min-width:0}.nav-info strong,.nav-info small{display:block}.nav-info small{color:#65758a;overflow-wrap:anywhere}.nav-edit{margin-top:18px}.nav-edit .field{margin:12px 0}.nav-edit input:not([type=checkbox]),.nav-edit textarea{width:100%;padding:11px;border:1px solid #cbd7e5;border-radius:8px}@media(max-width:650px){.nav-entry{flex-wrap:wrap}.nav-info{flex-basis:70%}}.nav-subitems{margin:-4px 0 12px 32px;padding-left:14px;border-left:2px solid #cce0f4;display:grid;gap:6px}.nav-subitem{display:flex;align-items:center;gap:12px;background:#f1f7fd;border:1px solid #e2edf8;border-radius:9px;padding:10px 12px}.nav-subitem>div{flex:1;min-width:0}.nav-subitem strong,.nav-subitem small{display:block}.nav-subitem small{color:#65758a;overflow-wrap:anywhere}.nav-subitem>span{color:#0c83c3}.nav-subitem .btn{padding:6px 9px}.cms-invite-notice{display:flex;align-items:flex-start;gap:12px;margin-top:14px;padding:14px 16px;border-radius:10px;border:1px solid}.cms-invite-success{background:#ecfdf3;border-color:#a6e5bd;color:#12643a}.cms-invite-error{background:#fff1f2;border-color:#fecdd3;color:#9f1239}.cms-invite-symbol{display:grid;place-items:center;flex:0 0 24px;height:24px;border-radius:50%;border:2px solid currentColor;font-weight:700}.cms-invite-notice>div{flex:1}.cms-invite-notice p{margin:4px 0 0;font-size:13px}.cms-invite-dismiss{background:transparent;border:0;color:inherit;font-size:21px;cursor:pointer;padding:0 4px}.cms-remove-confirm{margin:0 0 12px 24px;padding:16px;border:1px solid #fecaca;background:#fff7f7;border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.cms-remove-confirm strong{color:#991b1b}.cms-remove-confirm p{margin:5px 0 0;color:#7f1d1d;font-size:13px}.cms-danger-btn{background:#b91c1c!important;border-color:#b91c1c!important;color:white!important}.cms-danger-btn:disabled{opacity:.65;cursor:wait}.settings-content .field{margin:14px 0}.settings-content .field label{display:block;font-weight:600;margin-bottom:5px}.settings-content .field input{width:100%;padding:11px 12px;border:1px solid #cbd7e5;border-radius:8px}.settings-content h3{margin:24px 0 8px}.settings-content .code-footer{display:flex;justify-content:flex-end;gap:10px;align-items:center;margin-top:24px;flex-wrap:wrap}.settings-menu button{width:100%}</style><style>#cms-app{display:none}#auth-screen{min-height:100vh;display:grid;place-items:center;background:#f5f8fc;padding:20px}#auth-box{width:min(100%,420px);background:#fff;border:1px solid #e3eaf2;border-radius:14px;padding:30px;box-shadow:0 15px 50px #15365315}#auth-box h1{color:#0C83C3;margin-bottom:8px}#auth-box input{display:block;width:100%;padding:12px;border:1px solid #ccd9e8;border-radius:7px;margin:10px 0}#auth-error{color:#b52d38;min-height:24px}#auth-submit{width:100%}#logout{background:transparent;color:#0C83C3;border:1px solid #0C83C3;border-radius:6px;padding:7px 12px;margin-left:12px}</style></head><body><section id="auth-screen"><div id="auth-box"><h1>MarketingCy CMS</h1><p>Secure administrator sign-in</p><form id="auth-form" method="post" action="#" onsubmit="return false"><label for="auth-email">Email</label><input id="auth-email" type="email" autocomplete="username" required placeholder="Enter your email address"><label for="auth-password">Password</label><input id="auth-password" type="password" autocomplete="current-password" required placeholder="Password"><p id="auth-error" role="alert"></p><button class="btn" id="auth-submit" type="submit">Sign in</button></form><form id="auth-set-password-form" style="display:none"><h2 id="auth-set-password-heading">Create your password</h2><p>Choose a secure password for your MarketingCy CMS account.</p><label for="auth-new-password">New password</label><input id="auth-new-password" type="password" autocomplete="new-password" minlength="12" required placeholder="At least 12 characters"><label for="auth-confirm-password">Confirm password</label><input id="auth-confirm-password" type="password" autocomplete="new-password" minlength="12" required placeholder="Confirm password"><button class="btn" type="submit" style="width:100%">Save password</button><p id="auth-set-password-message" role="alert"></p></form></div></section><div class="app" id="cms-app"><aside class="side"><div class="brand"><span>◆</span> MarketingCy <small>CMS</small></div><nav class="nav" id="nav"><button class="active" data-view="dashboard">▦ Dashboard</button><button data-view="pages">▤ Pages</button><button data-view="slider">▣ Homepage Slider</button><button data-view="blog">✎ Blog Posts</button><button data-view="services">◈ Services</button><button data-view="portfolio">▧ Portfolio</button><button data-view="media">▧ Media Library</button><button data-view="enquiries">✉ Enquiries</button><button data-view="seo">⌕ SEO</button><button data-view="navigation">☷ Navigation</button><button data-view="users">♙ Users & Roles</button><button data-view="settings">⚙ Settings</button></nav><div class="side-account"><span class="account-label">Signed in as</span><span id="auth-identity">Administrator</span><button id="logout" type="button">↪ Log out</button></div></aside><main class="main"><header class="top"><strong>MarketingCy Content Studio</strong><button id="top-logout" type="button" class="btn secondary">Sign out</button></header><div class="content"><div id="view"></div></div></main></div>
<script src="/cms/content-data.js"></script>
<script>
const pages=[{title:'Homepage',slug:'/',status:'Published',type:'Page'},{title:'Services',slug:'/services/',status:'Published',type:'Page'},{title:'SEO Cyprus',slug:'/seo-cyprus/',status:'Published',type:'Page'},{title:'Web Design',slug:'/web-development-cyprus/',status:'Published',type:'Page'},{title:'About Us',slug:'/about/',status:'Published',type:'Page'},{title:'Contact',slug:'/contact/',status:'Published',type:'Page'}];
const posts=[];
const imported=window.marketingcyImportedContent||[];
for(const item of imported){let page=pages.find(p=>p.slug===item.slug);if(!page){page={title:item.title.split('|')[0].trim(),slug:item.slug,status:'Published',type:'Page'};pages.push(page)}page.body=item.body;page.meta=item.meta;page.description=item.description}
let current='dashboard', editing=null;
let cmsStore=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rows(data){return '<table class="table"><thead><tr><th>Title</th><th>URL / Slug</th><th>Status</th><th>Action</th></tr></thead><tbody>'+data.map((p,i)=>'<tr><td><strong>'+esc(p.title)+'</strong></td><td class="muted">'+esc(p.slug)+'</td><td><span class="tag '+(p.status==='Draft'?'draft':'')+'">'+esc(p.status)+'</span></td><td><button class="btn secondary" onclick="editItem(\''+current+'\','+i+')">Edit</button></td></tr>').join('')+'</tbody></table>'}
function show(name){current=name;editing=null;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===name));render()}
function editItem(type,i){if(type==='blog'&&cmsRole==='contributor'&&posts[i].author_id!==window.cmsCurrentUserId){alert('You can only edit your own blog posts');return}editing={type,i};structuredEditorBlocks=null;render();if(type==='pages')prepareStructuredEditor(pages[i].slug,pages[i].body)}
function newItem(){editing={type:current,i:-1};structuredEditorBlocks=null;render()}
let structuredEditorBlocks=null;
async function prepareStructuredEditor(slug,body){const root=document.getElementById('structured-editor');if(!root)return;root.textContent='Loading page sections…';try{let data;try{data=JSON.parse(body)}catch{}if(data?.format==='marketingcy-structured-v1'&&Array.isArray(data.blocks)){structuredEditorBlocks=data.blocks}else{const response=await fetch(slug,{cache:'no-store'});if(!response.ok)throw Error('Cannot load frontend page');const doc=new DOMParser().parseFromString(await response.text(),'text/html');structuredEditorBlocks=[...doc.querySelectorAll('main h1,main h2,main h3,main p')].filter(n=>!n.closest('form')).map(n=>({tag:n.tagName,html:n.innerHTML}))}root.innerHTML='<p>Edit each section below. Existing links and bold formatting are preserved. Save draft or publish when ready.</p>'+structuredEditorBlocks.map((b,i)=>'<div class="field" style="margin:14px 0"><label>Section '+(i+1)+' — '+b.tag+'</label><div class="structured-block" data-index="'+i+'" contenteditable="true" role="textbox" aria-multiline="true" style="min-height:45px;padding:12px;border:1px solid #cbd7e5;border-radius:6px;background:#fff;line-height:1.65;overflow-wrap:anywhere">'+b.html+'</div></div>').join('');}catch(e){root.textContent='Unable to load page sections: '+e.message}}
function collectStructuredBody(){if(!structuredEditorBlocks)return null;return JSON.stringify({format:'marketingcy-structured-v1',blocks:structuredEditorBlocks.map((b,i)=>({tag:b.tag,html:document.querySelector('.structured-block[data-index="'+i+'"]')?.innerHTML||''}))})}
function editor(){const data=editing.type==='blog'?posts:pages,p=editing.i<0?{title:'',slug:'',status:'Draft',type:'Page'}:data[editing.i];return '<div class="heading"><h1>'+ (editing.i<0?'Create':'Edit')+' '+(editing.type==='blog'?'Blog Post':'Page')+'</h1><button class="btn secondary" onclick="show(\''+editing.type+'\')">← Back</button></div><div class="panel fields"><div class="field"><label>Title</label><input id="title" value="'+esc(p.title)+'"></div><div class="field"><label>URL / Slug</label><input id="slug" value="'+esc(p.slug)+'"></div><div class="field"><label>Frontend hero heading</label><input id="heading" value="'+esc(p.heading||p.title)+'"></div><div class="field"><label>Frontend hero summary</label><textarea id="summary" style="min-height:90px">'+esc(p.summary||'')+'</textarea></div>'+(editing.type==='blog'?'<div class="field"><label>Article content</label><textarea id="body" style="min-height:260px">'+esc(p.body||'')+'</textarea></div>':'<div class="field"><label>Website page sections (rich text)</label><div id="structured-editor" style="max-height:550px;overflow:auto">Select an existing page to load its editable sections.</div></div><textarea id="body" hidden>'+esc(p.body||'')+'</textarea>')+'<div class="field"><label>SEO title</label><input id="meta" value="'+esc(p.meta||'')+'" placeholder="Search result title"></div><div class="field"><label>Meta description</label><textarea id="description" style="min-height:90px" placeholder="Search result description">'+esc(p.description||'')+'</textarea></div><div class="actions"><button class="btn secondary" onclick="saveItem(\'Draft\')">Save draft</button><button class="btn" onclick="saveItem(\'Published\')">Publish to website</button></div></div>'}
async function saveItem(status){const d=editing.type==='blog'?posts:pages,p={title:document.getElementById('title').value.trim(),slug:document.getElementById('slug').value.trim(),status,type:editing.type==='blog'?'Blog Post':'Page',body:editing.type==='pages'?(collectStructuredBody()||document.getElementById('body').value):document.getElementById('body').value,meta:document.getElementById('meta').value,description:document.getElementById('description').value,heading:document.getElementById('heading').value,summary:document.getElementById('summary').value};if(!p.title){alert('Please enter a title');return}if(editing.type==='pages'&&!structuredEditorBlocks){alert('Page sections are not loaded yet. Please wait and try again.');return}if(editing.type==='blog'){try{const saved=await window.marketingcyRolesStore.blogSave({...p,id:editing.i<0?null:d[editing.i].id});p.id=saved.id;p.author_id=saved.author_id}catch(e){alert('Blog save failed: '+e.message);return}}if(editing.type==='pages'&&cmsStore){try{const result=status==='Published'?await cmsStore.publish(p):await cmsStore.save(p);if(result.error){alert('Save failed: '+result.error.message);return}}catch(e){alert('Save failed. Please try again.');return}}if(editing.i<0)d.push(p);else d[editing.i]=p;show(editing.type)}

const customCode={head:'',bodyStart:'',bodyEnd:''};

let settingsTab='contact',settingsLoaded=false,settingsBusy=false,settingsNotice=null;
let settingsData={branding:{header_logo:'',footer_logo:'',favicon:'',sharing_image:''},contact:{email:'info@marketingcy.com',phone:'',location:'',instagram:'',facebook:'',linkedin:'',whatsapp:''},integrations:{ga4:'',gtm:'',search_console:''}};
async function settingsLoad(){document.getElementById('view').innerHTML='<section class="panel">Loading settings…</section>';try{const r=await window.marketingcySiteSettingsStore.load();if(r.error)throw r.error;for(const row of r.data||[])settingsData[row.section]={...settingsData[row.section],...row.draft};settingsLoaded=true;settingsDraw()}catch(e){document.getElementById('view').innerHTML='<section class="panel">Unable to load settings: '+esc(e.message)+'</section>'}}
function settingsSwitch(tab){settingsCapture();settingsTab=tab;settingsNotice=null;settingsDraw()}

async function renderSlider(){const v=document.getElementById('view');if(!window.marketingcySliderStore){v.innerHTML='<div class="panel">Sign in to load slider content.</div>';return}v.innerHTML='<div class="panel">Loading homepage slider…</div>';const result=await window.marketingcySliderStore.load();if(current!=='slider')return;if(result.error){v.textContent='Could not load slider: '+result.error.message;return}sliderRows=result.data||[];if(!sliderRows.some(x=>x.id===sliderSelected))sliderSelected=sliderRows[0]?.id||1;drawSlider()}

mentById('sl-preview').src=e.target.value})}

async function addSlider(){const id=Math.max(0,...sliderRows.map(x=>x.id))+1;if(id>10){alert('Maximum 10 slides supported.');return}const row={id,eyebrow:'NEW SLIDE',headline:'New headline',accent:'Highlighted text',description:'Describe your new slide.',image_url:''};sliderRows.push(row);sliderSelected=id;drawSlider();document.getElementById('sl-message').textContent='New slide: upload an image, then Save Draft or Publish. Nothing is live yet.'}
async function sliderSave(publish){if(sliderBusy)return;sliderBusy=true;const msg=document.getElementById('sl-message');msg.textContent='Saving…';document.getElementById('sl-save').disabled=true;document.getElementById('sl-publish').disabled=true;try{const row={id:sliderSelected,eyebrow:document.getElementById('sl-eyebrow').value.trim(),headline:document.getElementById('sl-headline').value.trim(),accent:document.getElementById('sl-accent').value.trim(),description:document.getElementById('sl-description').value.trim(),image_url:document.getElementById('sl-image').value.trim()};const file=document.getElementById('sl-upload').files[0];if(file)row.image_url=await window.marketingcySliderStore.upload(file,row.id);if(!row.image_url)throw Error('Please choose an image');if(!row.headline)throw Error('Headline is required');const result=publish?await window.marketingcySliderStore.publish(row):await window.marketingcySliderStore.save(row);if(result.error)throw result.error;const index=sliderRows.findIndex(x=>x.id===row.id);sliderRows[index]=row;document.getElementById('sl-image').value=row.image_url;document.getElementById('sl-preview').src=row.image_url;document.getElementById('sl-upload').value='';msg.textContent=publish?'Published! Refresh the homepage to see the change.':'Draft saved in Supabase. The public slide is unchanged.'}catch(e){msg.textContent='Error: '+e.message}finally{sliderBusy=false;document.getElementById('sl-save').disabled=false;document.getElementById('sl-publish').disabled=false}}

async function renderSeo(){const v=document.getElementById('view');v.innerHTML='<div class="panel">Loading SEO settings…</div>';try{[seoFiles,seoRedirects]=await Promise.all([window.marketingcySeoStore.files(),window.marketingcySeoStore.redirects()]);if(current==='seo')drawSeo()}catch(e){v.textContent='SEO Manager unavailable: '+e.message}}

e version in Supabase; public file endpoints and schema injection are not yet connected.</p></div>')}
async function seoSave(publish){const status=document.getElementById('seo-status'),value=document.getElementById('seo-code').value;try{if(seoTab==='schema')JSON.parse(value);if(seoTab==='sitemap'&&value.trim()&&!value.includes('<urlset'))throw Error('Sitemap must contain a urlset element');if(seoTab==='robots'&&/Disallow:\s*\/\s*$/m.test(value)&&!confirm('This may block crawling of the entire website. Continue?'))return;await window.marketingcySeoStore.save(seoTab,value,publish);const item=seoFiles.find(x=>x.key===seoTab);item.draft=value;if(publish)item.published=value;status.textContent=publish?'Published settings saved to Supabase. Public endpoints are not connected yet.':'Draft saved.'}catch(e){status.textContent='Error: '+e.message}}

let enquiryNotes=[],enquiryItems=[],enquirySearch='',enquiryType='all',enquiryService='all',enquiryTime='all',enquiryExpanded=new Set();

async function enquiryUpdate(i,field,value){const m=enquiryItems[i];if(!m||!['status','priority'].includes(field))return;try{const saved=await window.marketingcyEnquiriesStore.update(m.id,{[field]:value});m[field]=saved[field];drawEnquiries()}catch(e){alert('Could not save '+field+': '+e.message);drawEnquiries()}}

function drawEnquiries(rebuild=true){if(current!=='enquiries')return;const v=document.getElementById('view');if(!v)return;const items=enquiryFilter(),consult=enquiryItems.filter(m=>!m.email).length,contact=enquiryItems.filter(m=>!!m.email).length,services=new Set(enquiryItems.map(m=>m.service).filter(x=>x&&x!=='Contact form'));const stat=(icon,num,label)=>'<div class="enq-stat"><span class="symbol">'+icon+'</span><div><strong>'+num+'</strong><small>'+label+'</small></div></div>';const options=(values,selected)=>values.map(x=>'<option value="'+esc(x[0])+'" '+(selected===x[0]?'selected':'')+'>'+esc(x[1])+'</option>').join('');const controls='<div class="enq-tools"><input aria-label="Search enquiries" placeholder="Search by name, email, phone or message..." id="enq-search" value="'+esc(enquirySearch)+'" oninput="enquirySetFilter(\'search\',this.value)"><select aria-label="Filter by type" onchange="enquirySetFilter(\'type\',this.value)">'+options([['all','All Types'],['Consultation request','Consultation Requests'],['Contact message','Contact Messages']],enquiryType)+'</select><select aria-label="Filter by service" onchange="enquirySetFilter(\'service\',this.value)">'+options([['all','All Services'],...[...new Set(enquiryItems.map(m=>m.service).filter(Boolean))].sort().map(x=>[x,x])],enquiryService)+'</select><select aria-label="Filter by date" onchange="enquirySetFilter(\'time\',this.value)">'+options([['all','All Time'],['7','Last 7 Days'],['30','Last 30 Days'],['90','Last 90 Days']],enquiryTime)+'</select><span class="muted" style="align-self:center">'+items.length+' enquiries</span></div>';const rows=items.map(m=>{const i=enquiryItems.indexOf(m),contact=!!m.email,link=m.email?'mailto:'+encodeURIComponent(m.email):m.telephone?'tel:'+String(m.telephone).replace(/[^+0-9]/g,''):'';return '<section class="enq-row '+(contact?'contact':'')+'"><div><div class="enq-name">◯ &nbsp;'+esc(m.full_name||'Unnamed enquiry')+'</div><div class="enq-sub">'+(m.email?'✉ '+esc(m.email):m.telephone?'☎ '+esc(m.telephone):'No contact information')+'</div></div><div><span class="enq-pill">'+(contact?'◉ ':'▣ ')+enquiryKind(m)+'</span><div class="enq-sub">◇ Service: '+esc(m.service||'Not specified')+'</div>'+(m.message?'<div class="enq-message">'+esc(m.message.length>140?m.message.slice(0,140)+'…':m.message)+'</div>':'')+'</div><div class="enq-sub">▣ '+esc(enquiryDate(m))+'</div><div class="enq-actions"><button type="button" aria-label="View full enquiry" title="View full enquiry" onclick="enquiryToggle('+i+')">◉</button>'+'</div>'+(enquiryExpanded.has(i)?'<div class="enq-detail"><strong>Full enquiry</strong><p><strong>Name:</strong> '+esc(m.full_name||'')+'</p><p><strong>Email:</strong> '+esc(m.email||'Not supplied')+'</p><p><strong>Phone:</strong> '+esc(m.telephone||'Not supplied')+'</p><p><strong>Service:</strong> '+esc(m.service||'Not specified')+'</p><p><strong>Message:</strong> '+esc(m.message||'No message supplied')+'</p>'+enquiryControls(m,i)+enquiryNotePanel(m,i)+'</div>':'')+'</section>'}).join('');v.innerHTML='<div class="heading"><div><h1>▤ Forms & Enquiries</h1><p>Contact form and consultation requests saved in Supabase.</p></div><div class="actions"><button class="btn secondary" onclick="renderEnquiries()">↻ Refresh</button><button class="btn" onclick="enquiryExport()">↓ Export CSV</button></div></div><div class="enq-stats">'+stat('✉',enquiryItems.length,'Total Enquiries')+stat('▣',consult,'Consultation Requests')+stat('☏',contact,'Contact Messages')+stat('↗',services.size,'Services Requested')+'</div>'+controls+(rows||'<div class="enq-empty">No enquiries match your filters.</div>');if(!rebuild){const input=document.getElementById('enq-search');if(input&&document.activeElement!==input&&document.activeElement?.id==='enq-search')input.focus()}}
async function renderEnquiries(){const v=document.getElementById('view');v.innerHTML='<div class="panel">Loading enquiries…</div>';try{enquiryItems=await window.marketingcyEnquiriesStore.list();enquiryNotes=await window.marketingcyEnquiriesStore.notes(enquiryItems.map(m=>m.id));if(current!=='enquiries')return;drawEnquiries()}catch(e){if(current==='enquiries')v.textContent='Unable to load enquiries: '+e.message}}

async function uploadMedia(){const input=document.getElementById('media-upload-files'),files=[...input.files],category=document.getElementById('media-upload-category').value,status=document.getElementById('media-status');if(!files.length){status.textContent='Choose files first.';return}let success=0;for(const f of files){status.textContent='Uploading '+(success+1)+' / '+files.length+': '+f.name;try{await window.marketingcyMediaStore.upload(f,category);success++}catch(e){status.textContent='Uploaded '+success+' file(s). Failed on '+f.name+': '+e.message;return}}mediaItems=await window.marketingcyMediaStore.list();drawMedia();document.getElementById('media-status').textContent=success+' file(s) uploaded successfully.'}

async function deleteMedia(id){const item=mediaItems.find(x=>x.id===id);if(!item)return;const used=await Promise.resolve();if(!confirm('Remove '+item.name+' from the Media Library? Files hosted elsewhere will only be unlisted. Check whether any published page uses this image before deleting.'))return;try{await window.marketingcyMediaStore.remove(item);mediaItems=mediaItems.filter(x=>x.id!==id);drawMedia()}catch(e){alert('Delete failed: '+e.message)}}

async function uploadPortfolioImage(i){const get=k=>document.querySelector('[data-port="'+i+'"][data-key="'+k+'"]');const file=get('upload').files[0],status=get('upload-status');if(!file){status.textContent='Choose an image first.';return}status.textContent='Uploading…';try{const url=await window.marketingcyPortfolioStore.upload(file,portfolioRows[i].id);get('image_url').value=url;get('upload').value='';status.textContent='Image uploaded successfully. Save Draft or Publish to apply.'}catch(e){status.textContent='Upload failed: '+e.message}}
async function savePortfolio(publish){if(portfolioBusy)return;portfolioBusy=true;const status=document.getElementById('portfolio-status');status.textContent='Saving…';try{const rows=[];for(let i=0;i<portfolioRows.length;i++){const get=k=>document.querySelector('[data-port="'+i+'"][data-key="'+k+'"]');const row={...portfolioRows[i]};for(const k of ['title','display_name','category','description','image_url','project_url'])row[k]=get(k).value.trim();for(const k of ['show_home','show_portfolio'])row[k]=get(k).checked;for(const k of ['home_order','portfolio_order'])row[k]=Math.max(1,Number(get(k).value)||i+1);const file=get('upload').files[0];if(file)row.image_url=await window.marketingcyPortfolioStore.upload(file,row.id);if(!row.title||!row.image_url||!row.project_url)throw Error('Project '+(i+1)+' ('+(row.title||'Untitled')+') is missing: '+[!row.title?'title':null,!row.image_url?'image (upload or enter URL)':null,!row.project_url?'original project URL':null].filter(Boolean).join(', '));if(!/^https:\/\//.test(row.image_url)&&!/^\/(?!\/)/.test(row.image_url))throw Error('Image must use HTTPS or an internal path');if(!/^https:\/\//i.test(row.project_url)&&!/^\/(?!\/)/.test(row.project_url)){if(/^(?:www\.)?[a-z0-9][a-z0-9.-]*\.[a-z]{2,}(?::[0-9]+)?(?:[/?#][^\s]*)?$/i.test(row.project_url))row.project_url='https://'+row.project_url;else throw Error('Project '+(i+1)+' ('+row.title+'): enter a valid website address such as www.example.com or an internal path starting with /')}get('project_url').value=row.project_url;rows.push(row)}await window.marketingcyPortfolioStore.save(rows,publish);portfolioRows=rows;status.textContent=publish?'Published to both connected pages. Refresh to see updates.':'Draft saved; live pages unchanged.'}catch(e){status.textContent='Error: '+e.message}finally{portfolioBusy=false}}

let navTab='top',navRows={top:[],footer:[]},navLoaded=false,navDirty=false,navEdit=-2;
const navDefaults={top:[{label:'Home',url:'/',visible:true,children:[]},{label:'Services',url:'/services',visible:true,children:[{label:'SEO (Search Engine Optimization)',url:'/services/seo'},{label:'PPC / Google Ads',url:'/services/ppc'},{label:'Web Development',url:'/services/web-development'},{label:'Social Media Marketing',url:'/services/social-media-marketing'},{label:'Email Marketing',url:'/services/email-marketing'}]},{label:'Portfolio',url:'/portfolio',visible:true,children:[]},{label:'About',url:'/about',visible:true,children:[]},{label:'Blog',url:'/blog',visible:true,children:[]},{label:'Contact',url:'/contact',visible:true,children:[]}],footer:[['Home','/'],['Services','/services'],['Portfolio','/portfolio'],['About','/about'],['Blog','/blog'],['Contact','/contact']].map(([label,url])=>({label,url,visible:true,children:[]}))};

function navOpen(i){navEdit=i;navDraw()}
function navForm(){const x=navRows[navTab][navEdit]||{label:'',url:'',visible:true,newTab:false,children:[]};return '<section class="panel nav-edit"><h2>'+(navEdit<0?'Add':'Edit')+' Menu Item</h2><div class="field"><label>Navigation label</label><input id="nav-label" value="'+esc(x.label)+'"></div><div class="field"><label>Link URL (internal path or https:// URL)</label><input id="nav-url" value="'+esc(x.url||'')+'"></div><div class="field"><label><input type="checkbox" id="nav-visible" '+(x.visible!==false?'checked':'')+'> Visible on website</label></div><div class="field"><label><input type="checkbox" id="nav-newtab" '+(x.newTab?'checked':'')+'> Open in new tab</label></div>'+(navTab==='top'?'<div class="field"><label>Dropdown subitems — one per line: Label | URL</label><textarea id="nav-children" rows="5" placeholder="SEO | /services/seo">'+esc((x.children||[]).map(c=>c.label+' | '+c.url).join('\n'))+'</textarea></div>':'')+'<div class="actions"><button class="btn secondary" onclick="navEdit=-2;navDraw()">Cancel</button><button class="btn" onclick="navApply()">Apply Changes</button></div></section>'}
function navApply(){const label=document.getElementById('nav-label').value.trim(),url=document.getElementById('nav-url').value.trim();if(!label){alert('Enter a label');return}if(url&&!url.startsWith('/')&&!/^https:\/\//i.test(url)){alert('Use an internal /path or an https:// URL');return}let children=[];if(navTab==='top'){const lines=document.getElementById('nav-children').value.split('\n').map(x=>x.trim()).filter(Boolean);for(const line of lines){const [a,b]=line.split('|').map(x=>x.trim());if(!a||!b||(!b.startsWith('/')&&!/^https:\/\//i.test(b))){alert('Each dropdown item needs Label | /path');return}children.push({label:a,url:b,visible:true})}}if(!url&&!children.length){alert('Add a URL or dropdown items');return}const item={label,url,visible:document.getElementById('nav-visible').checked,newTab:document.getElementById('nav-newtab').checked,children};if(navEdit<0)navRows[navTab].push(item);else navRows[navTab][navEdit]=item;navEdit=-2;navDirty=true;navDraw()}
async function navSave(publish){if(!window.marketingcyNavigationStore){alert('Sign in first');return}if(navEdit!==-2){alert('Apply or cancel the open editor first');return}if(publish&&!confirm('Publish the '+navTab+' menu settings?'))return;try{await window.marketingcyNavigationStore.save(navTab,navRows[navTab],publish);navDirty=false;navDraw();alert(publish?'Menu settings published to Supabase. Frontend integration must read the published menu to display changes.':'Menu draft saved to Supabase.')}catch(e){alert('Could not save menu: '+e.message)}}


let cmsRole='admin',cmsUsers=[],blogLoaded=false,usersBusy=false;
let cmsInviteNotice=null,cmsRemovePending=null,cmsRemoveNotice=null,cmsRemoveBusy=false;
function cmsInviteNoticeHtml(){if(!cmsInviteNotice)return '';const good=cmsInviteNotice.type==='success';return '<div class="cms-invite-notice '+(good?'cms-invite-success':'cms-invite-error')+'" role="status" aria-live="polite"><span class="cms-invite-symbol">'+(good?'✓':'!')+'</span><div><strong>'+esc(cmsInviteNotice.title)+'</strong><p>'+esc(cmsInviteNotice.detail)+'</p></div><button type="button" class="cms-invite-dismiss" onclick="cmsInviteNotice=null;cmsShowInviteNotice()" aria-label="Dismiss notification">×</button></div>'}
function cmsShowInviteNotice(){const el=document.getElementById('cms-invite-feedback');if(el)el.innerHTML=cmsInviteNoticeHtml()}

window.cmsApplyRole=function(role){cmsRole=role;document.querySelectorAll('[data-view]').forEach(b=>{const allowed=role==='contributor'?['dashboard','blog']:role==='admin'?null:null;b.style.display=(allowed&&!allowed.includes(b.dataset.view))||(role!=='super_admin'&&b.dataset.view==='users')?'none':''});if(role==='contributor'&&!['dashboard','blog'].includes(current))current='blog';if(current==='users'&&role!=='super_admin')current='dashboard';render()};
async function cmsLoadBlog(){try{const data=await window.marketingcyRolesStore.blogList();posts.splice(0,posts.length,...data.map(p=>({id:p.id,author_id:p.author_id,title:p.title,slug:p.slug,status:p.status==='published'?'Published':'Draft',type:'Blog Post',body:p.body,meta:p.seo_title,description:p.meta_description})));blogLoaded=true;if(current==='blog')render()}catch(e){document.getElementById('view').innerHTML='<div class="panel">Blog loading failed: '+esc(e.message)+'</div>'}}
async function cmsUsersLoad(){if(cmsRole!=='super_admin')return;const v=document.getElementById('view');v.innerHTML='<div class="panel">Loading team members…</div>';try{const data=await window.marketingcyRolesStore.manage({action:'list'});cmsUsers=data.users||[];cmsUsersDraw()}catch(e){v.innerHTML='<div class="panel">User management failed: '+esc(e.message)+'</div>'}}
function cmsRemoveNoticeHtml(){if(!cmsRemoveNotice)return '';const good=cmsRemoveNotice.type==='success';return '<div class="cms-invite-notice '+(good?'cms-invite-success':'cms-invite-error')+'" role="status"><span class="cms-invite-symbol">'+(good?'✓':'!')+'</span><div><strong>'+esc(cmsRemoveNotice.title)+'</strong><p>'+esc(cmsRemoveNotice.detail)+'</p></div><button class="cms-invite-dismiss" onclick="cmsRemoveNotice=null;cmsUsersDraw()" aria-label="Dismiss">×</button></div>'}
function cmsUsersDraw(){const v=document.getElementById('view');v.innerHTML='<div class="heading"><div><h1>Users & Roles</h1><p>Only the Super Admin can invite, change roles or remove users.</p></div></div><div class="cards">'+['super_admin','admin','contributor'].map(role=>'<div class="card"><strong>'+cmsUsers.filter(u=>u.role===role).length+'</strong><span>'+({super_admin:'Super Admin',admin:'Admins',contributor:'Contributors'}[role])+'</span></div>').join('')+'</div><section class="panel"><h2>Invite team member</h2><div class="actions"><input id="invite-email" type="email" placeholder="team@example.com" style="flex:1;min-width:220px;padding:10px;border:1px solid #cbd7e5;border-radius:8px"><select id="invite-role" style="padding:10px;border:1px solid #cbd7e5;border-radius:8px"><option value="contributor">Contributor</option><option value="admin">Admin</option></select><button class="btn" onclick="cmsInvite()">Send invitation</button></div><div id="cms-invite-feedback">'+cmsInviteNoticeHtml()+'</div><p class="muted">Contributors can create and publish their own blog posts without approval. Admins manage website content but cannot manage users.</p></section><section class="panel" style="margin-top:18px"><h2>Team members</h2><div id="cms-remove-feedback">'+cmsRemoveNoticeHtml()+'</div><div class="nav-list">'+cmsUsers.map(u=>'<div class="nav-entry"><div class="nav-info"><strong>'+esc(u.email||'Invited user')+'</strong><small>'+esc(u.role.replace('_',' '))+'</small></div>'+(u.role==='super_admin'?'<span class="tag">Protected owner</span>':'<select onchange="cmsChangeRole(\''+esc(u.user_id)+'\',this.value)"><option value="admin" '+(u.role==='admin'?'selected':'')+'>Admin</option><option value="contributor" '+(u.role==='contributor'?'selected':'')+'>Contributor</option></select><button class="btn secondary" onclick="cmsResetPassword(\''+esc(u.user_id)+'\')">Reset password</button><button class="btn secondary" onclick="cmsRemoveUser(\''+esc(u.user_id)+'\')">Remove</button>')+'</div>'+(cmsRemovePending===u.user_id?'<div class="cms-remove-confirm"><div><strong>Remove '+esc(u.email||'this team member')+'?</strong><p>This permanently deletes their CMS account and revokes access. This cannot be undone.</p></div><div class="actions"><button class="btn secondary" onclick="cmsRemovePending=null;cmsUsersDraw()">Cancel</button><button class="btn cms-danger-btn" id="cms-remove-confirm-btn" onclick="cmsConfirmRemove(\''+esc(u.user_id)+'\')">Yes, remove user</button></div></div>':'')).join('')+'</div></section>'}
async function cmsInvite(){const email=document.getElementById('invite-email').value.trim(),role=document.getElementById('invite-role').value,button=document.querySelector('button[onclick="cmsInvite()"]');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){cmsInviteNotice={type:'error',title:'Please enter a valid email address',detail:'Check the email and try again.'};cmsShowInviteNotice();return}cmsInviteNotice=null;cmsShowInviteNotice();button.disabled=true;button.textContent='Sending…';try{await window.marketingcyRolesStore.manage({action:'invite',email,role});cmsInviteNotice={type:'success',title:'Invitation sent successfully!',detail:'An invitation email has been sent to '+email+'.'};document.getElementById('invite-email').value='';const data=await window.marketingcyRolesStore.manage({action:'list'});cmsUsers=data.users||[];cmsUsersDraw()}catch(e){cmsInviteNotice={type:'error',title:'Could not send invitation',detail:e.message||'Please try again.'};cmsShowInviteNotice()}finally{const b=document.querySelector('button[onclick="cmsInvite()"]');if(b){b.disabled=false;b.textContent='Send invitation'}}}
async function cmsChangeRole(user_id,role){if(!confirm('Change this team member to '+role+'?')){cmsUsersDraw();return}try{await window.marketingcyRolesStore.manage({action:'change_role',user_id,role});cmsUsersLoad()}catch(e){alert(e.message);cmsUsersDraw()}}
async function cmsResetPassword(user_id){const target=cmsUsers.find(u=>u.user_id===user_id);if(!target||!confirm('Send a password reset link to '+(target.email||'this user')+'? Verify their identity first.'))return;try{await window.marketingcyRolesStore.manage({action:'reset_password',user_id});alert('Reset email sent and request logged.')}catch(e){alert('Reset failed: '+e.message)}}
function cmsRemoveUser(user_id){if(cmsRemoveBusy)return;cmsRemoveNotice=null;cmsRemovePending=cmsRemovePending===user_id?null:user_id;cmsUsersDraw()}
async function cmsConfirmRemove(user_id){if(cmsRemoveBusy||cmsRemovePending!==user_id)return;const target=cmsUsers.find(u=>u.user_id===user_id);if(!target||target.role==='super_admin')return;cmsRemoveBusy=true;const btn=document.getElementById('cms-remove-confirm-btn');if(btn){btn.disabled=true;btn.textContent='Removing…'}try{await window.marketingcyRolesStore.manage({action:'remove',user_id});cmsRemovePending=null;cmsRemoveNotice={type:'success',title:'Team member removed',detail:(target.email||'The team member')+' no longer has access to MarketingCy CMS.'};cmsUsers=cmsUsers.filter(u=>u.user_id!==user_id);cmsUsersDraw()}catch(e){cmsRemoveNotice={type:'error',title:'Could not remove team member',detail:e.message||'Please try again.'};cmsRemovePending=null;cmsUsersDraw()}finally{cmsRemoveBusy=false}}

window.cmsConnect=async function(store){cmsStore=store;if(window.cmsUserRole==='contributor'){blogLoaded=false;cmsLoadBlog();return}try{const result=await store.load();if(result.error)throw result.error;for(const row of result.data||[]){let p=pages.find(p=>p.slug===row.slug);if(!p){p={slug:row.slug,type:'Page'};pages.push(p)}p.title=row.title;p.body=row.draft_body;p.meta=row.draft_seo_title;p.description=row.draft_meta_description;p.heading=row.draft_heading;p.summary=row.draft_summary;p.status=row.status==='published'?'Published':'Draft'}render()}catch(e){alert('Database loading failed. Changes cannot be saved permanently until the connection is restored.')}};
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.view)));render();
</script><script>
window.cmsAuthReady=false;
(function(){
 var form=document.getElementById('auth-form');
 var error=document.getElementById('auth-error');
 form.addEventListener('submit',function(event){
  event.preventDefault();
  if(!window.cmsAuthReady){
   error.textContent='The CMS login script did not initialize. Please open Developer Tools (F12), select Console, and share the first red error. No credentials are needed.';
  }
 },true);
 window.addEventListener('error',function(event){
  if(!window.cmsAuthReady && error && !error.textContent){
   error.textContent='CMS script error: '+(event.message||'Unable to load login script.');
  }
 });
 window.addEventListener('unhandledrejection',function(event){
  if(!window.cmsAuthReady && error)error.textContent='CMS authentication failed to initialize: '+(event.reason?.message||'Network or script error.');
 });
})();
</script><script type="module" src="/cms/auth.js?v=absolute-cms-path-4"></script></body></html>
